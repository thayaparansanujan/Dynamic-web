<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Global Enterprises</title>
<style>
:root{--bg:#07111f;--panel:#101f33;--panel2:#142943;--text:#f4f7fb;--muted:#a9b8ca;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#06101d,#102b47);color:var(--text);min-height:100vh}
header{text-align:center;padding:48px 18px 30px}
.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:grid;place-items:center;margin:0 auto 16px;font-size:28px;font-weight:800;color:#06101d}
h1{font-size:clamp(27px,5vw,42px);margin:0 0 10px}
header p{color:var(--muted);margin:0;font-size:15px}
main{width:min(1050px,92%);margin:0 auto 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
a.card,button.card{font:inherit;text-align:left;color:inherit;text-decoration:none;border:1px solid #29425f;background:linear-gradient(145deg,var(--panel),var(--panel2));border-radius:20px;padding:25px;min-height:190px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;transition:.2s}
a.card:hover,button.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 28px #0005}
.icon{font-size:34px;margin-bottom:18px}
.card h2{font-size:20px;margin:0 0 9px}
.card p{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.tag{margin-top:auto;padding-top:18px;color:#7dd3fc;font-size:12px;font-weight:bold;letter-spacing:.4px}
footer{text-align:center;color:#8194aa;padding:0 15px 28px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">DG</div>
  <h1>Dynamic Global Enterprises</h1>
  <p>One platform. Multiple services.</p>
</header>
<main>
  <section class="grid">
    <a class="card" href="DYNAMIC-MAL.html">
      <div class="icon">🛍️</div><h2>Shopping</h2>
      <p>Browse products and place your orders online.</p>
      <div class="tag">OPEN SHOPPING</div>
    </a>
    <button class="card" type="button" onclick="comingSoon('Driving Learners')">
      <div class="icon">🚗</div><h2>Driving Learners</h2>
      <p>Driving learner services and related information.</p>
      <div class="tag">COMING SOON</div>
    </button>
    <button class="card" type="button" onclick="comingSoon('Job Bank')">
      <div class="icon">💼</div><h2>Job Bank</h2>
      <p>Explore job opportunities and employment listings.</p>
      <div class="tag">COMING SOON</div>
    </button>
    <button class="card" type="button" onclick="comingSoon('Real Estate')">
      <div class="icon">🏡</div><h2>Real Estate</h2>
      <p>Browse land and property listings for buying or selling.</p>
      <div class="tag">COMING SOON</div>
    </button>
    <button class="card" type="button" onclick="comingSoon('House or Business Place Rent')">
      <div class="icon">🏬</div><h2>House or Business Place Rent</h2>
      <p>Find houses, shops, and business places available for rent.</p>
      <div class="tag">COMING SOON</div>
    </button>
  </section>
</main>
<footer>© <span id="year"></span> Dynamic Global Enterprises</footer>
<script>
function comingSoon(section){alert(section + ' section is coming soon.');}
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
